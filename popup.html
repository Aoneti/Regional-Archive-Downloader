<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Yar Downloader</title>

  <!-- Lato font -->
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #ffffff;
      --text: #222222;
      --panel: #f5f5f5;
      --border: #dddddd;
      --accent: #7FBE00;
      --danger: #d9534f;
    }
    html.dark {
      --bg: #111111;
      --text: #eeeeee;
      --panel: #1a1a1a;
      --border: #333333;
    }

    body {
      width: 260px;
      margin: 0;
      padding: 12px;
      font-family: "Lato", system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      background: var(--bg);
      color: var(--text);
    }

    h1 { font-size: 15px; font-weight: 700; margin: 0 0 10px 0; }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
    }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    .btn.secondary {
      background: #fff;
    }

    .row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .icon-btn {
      flex: 1 1 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 0;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      font-size: 14px;
    }
    .icon-btn.danger { background: var(--danger); color: #fff; border-color: var(--danger); }

    .icon-btn:disabled { opacity: 0.6; cursor: default; }

    .progress-wrap { margin-top: 8px; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
    .progress-bar { height: 100%; width: 0%; background: var(--accent); transition: width 0.2s ease; }

    .status { font-size: 12px; margin-top: 8px; min-height: 20px; opacity: 0.95; }

    .footer { display:flex; justify-content:space-between; align-items:center; font-size:11px; opacity:0.7; margin-top:8px; }
    .link { cursor: pointer; text-decoration: underline; }
  </style>
</head>

<body>
  <h1>YARchive Downloader</h1>

  <div class="panel">
    <button id="btnAll" class="btn primary">Скачать весь документ</button>

    <button id="btnCurrent" class="btn" style="margin-top:8px;">Скачать текущую страницу</button>

    <div class="row">
      <button id="btnPause" class="icon-btn" title="Пауза / Продолжить">⏸</button>
      <button id="btnStop" class="icon-btn danger" title="Остановить">⏹</button>
    </div>

    <div class="progress-wrap">
      <div id="progressBar" class="progress-bar"></div>
    </div>

    <div id="status" class="status">Прогресс</div>
  </div>

  <div class="footer">
    <span>ГАЯО</span>
    <span id="openOptions" class="link">⚙ Настройки</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
